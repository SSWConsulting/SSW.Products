name: Auto Translation

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: number

env:
  PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}

# Runs branch from and push to main, so overlapping runs can clobber each
# other's translations. Queue them instead; never cancel, since a cancelled
# run has already paid for its OpenAI calls.
concurrency:
  group: auto-translation
  cancel-in-progress: false

jobs:
  translate:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The scripts' deps (openai, minimatch, axios) are declared in
          # package.json. Running `npm install` over a pnpm-installed tree
          # fails on pnpm's symlink layout with "Cannot read properties of
          # null (reading 'name')".
          pnpm install --frozen-lockfile

      - name: Detect Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: node .github/scripts/detect-files.js

      - name: Process Translation
        if: env.HAS_CHANGED_FILES == 'true' || env.HAS_FILE_OPERATIONS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: |
          TIMESTAMP=$(date +%s)
          BRANCH_NAME="auto-translation-pr-${{ env.PR_NUMBER }}-$TIMESTAMP"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          if [ "$HAS_FILE_OPERATIONS" = "true" ]; then
            node .github/scripts/sync-files.js
          fi

          if [ "$HAS_CHANGED_FILES" = "true" ]; then
            node .github/scripts/translate-files.js
          fi

      - name: Commit Changes
        if: env.HAS_CHANGED_FILES == 'true' || env.HAS_FILE_OPERATIONS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Set by the Process Translation step; if that was skipped, pushing
          # would target whatever branch is checked out. Fail loudly instead.
          if [ -z "${BRANCH_NAME:-}" ]; then
            echo "::error::BRANCH_NAME is not set - refusing to push"
            exit 1
          fi

          git add content/
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto Translation: Chinese content for PR #${{ env.PR_NUMBER }}"
            git push origin "$BRANCH_NAME"

            REPO=${{ github.repository }} \
            GITHUB_SERVER_URL=${{ github.server_url }} \
            BRANCH_NAME="$BRANCH_NAME" \
              node .github/scripts/create-pr.js
          else
            echo "No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          echo "- Original PR: #${{ env.PR_NUMBER }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
